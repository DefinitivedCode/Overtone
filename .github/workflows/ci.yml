name: ci
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: lint, types and unit tests fail in a couple of minutes, in parallel with the browser jobs.
  checks:
    runs-on: ubuntu-latest
    # A hung runner step (seen: apt in install-deps) should fail fast, not sit for an hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/dicts
          key: dicts-${{ hashFiles('scripts/packs/sources.json') }}
      - run: npm run packs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ling
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linguistic-reports
          path: reports/linguistic-*.md

  # One runner per device profile instead of four profiles back to back.
  e2e:
    runs-on: ubuntu-latest
    # Playwright's official image ships the browsers and their system libraries, so there is no apt step to hang
    # ('playwright install-deps' stalled for an hour on two runs). Keep the tag equal to @playwright/test (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    # A hung runner step (seen: apt in install-deps) should fail fast, not sit for an hour.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: webkit-iphone
          - project: webkit-iphone-se
          - project: chromium-mobile
          - project: chromium-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/dicts
          key: dicts-${{ hashFiles('scripts/packs/sources.json') }}
      - run: npm run packs
      - name: Container image matches the installed Playwright
        run: |
          v="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          test "$v" = "1.64.1" || { echo "@playwright/test is $v but the CI image is v1.64.1: update the container tag in ci.yml"; exit 1; }
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report

  # Single required-check name, as before.
  verify:
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    # A hung runner step (seen: apt in install-deps) should fail fast, not sit for an hour.
    timeout-minutes: 5
    steps:
      - run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.e2e.result }}" = success
