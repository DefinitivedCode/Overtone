name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - uses: actions/cache@v4
        with:
          path: .cache/dicts
          key: dicts-${{ hashFiles('scripts/packs/sources.json') }}
      - run: npm run packs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ling
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linguistic-reports
          path: reports/linguistic-*.md
