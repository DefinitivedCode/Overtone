name: ci
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: lint, types and unit tests fail in a couple of minutes, in parallel with the browser jobs.
  checks:
    runs-on: ubuntu-latest
    # A hung runner step (seen: apt in install-deps) should fail fast, not sit for an hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/dicts
          key: dicts-${{ hashFiles('scripts/packs/sources.json') }}
      - run: npm run packs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ling
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linguistic-reports
          path: reports/linguistic-*.md

  # One runner per device profile instead of four profiles back to back.
  e2e:
    runs-on: ubuntu-latest
    # A hung runner step (seen: apt in install-deps) should fail fast, not sit for an hour.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: webkit-iphone
            browser: webkit
          - project: webkit-iphone-se
            browser: webkit
          - project: chromium-mobile
            browser: chromium
          - project: chromium-desktop
            browser: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/dicts
          key: dicts-${{ hashFiles('scripts/packs/sources.json') }}
      - run: npm run packs
      - id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report

  # Single required-check name, as before.
  verify:
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    # A hung runner step (seen: apt in install-deps) should fail fast, not sit for an hour.
    timeout-minutes: 5
    steps:
      - run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.e2e.result }}" = success
